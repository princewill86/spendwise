name: Bug report
description: Report a reproducible problem with Spendwise
title: "[Bug] "
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Describe the environment, expected behavior, and what happened. Use synthetic financial data.
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed credentials, personal information, and private financial data from this report.
          required: true
